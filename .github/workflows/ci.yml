name: CI

# Runs on every pull request into development or main, and on those branches
# themselves. `development` is the working branch; `main` is production and only
# receives release merges from development. Nothing here takes more than about
# two minutes, so it can gate merges without being annoying. The full balance
# sweep is a separate, manually triggered job further down, because it takes
# roughly 18 minutes.

on:
  pull_request:
    branches: [main, development]
  push:
    branches: [main, development]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sim:
    name: Simulation checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The `secrets` context cannot be read from an `if:` condition, so the
    # token is lifted into the environment here and the optional steps below
    # test `env.DUNGEONSIM_TOKEN` instead.
    env:
      DUNGEONSIM_TOKEN: ${{ secrets.DUNGEONSIM_TOKEN }}
      # Both the self-test and the port verifier look here. If the optional
      # checkout below did not run, this path does not exist, and both report
      # that they skipped rather than passing quietly.
      CATACLYSM_SCORING_REFERENCE: ${{ github.workspace }}/DungeonSimulator/src/utils/calculateScores.tsx
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: sim/requirements-dev.txt

      - name: Install development dependencies
        run: python -m pip install --disable-pip-version-check -r sim/requirements-dev.txt

      # Checks for real defects only: syntax errors, undefined names, unused
      # imports, and bugbear rules. Style and import order are not enforced.
      # See the [tool.ruff.lint] section of pyproject.toml for why.
      - name: Lint
        run: python -m ruff check .

      - name: Tests
        run: python -m pytest

      # The power model is a port of calculateScores.tsx in the separate
      # DungeonSimulator repository. This reports that it skipped, rather than
      # passing quietly, when that repository is not available.
      - name: Power model self-test
        run: python -m cataclysm_sim.scoring
        working-directory: sim

      # Optional and off by default. DungeonSimulator is private and this
      # repository is public, so checking it out needs a token in
      # secrets.DUNGEONSIM_TOKEN with read access to it. Without that secret
      # this step is skipped and the port verifier below reports that it could
      # not run. GitHub does not expose secrets to pull requests from forks, so
      # a fork PR will always skip this.
      - name: Check out the authoritative power model
        if: ${{ env.DUNGEONSIM_TOKEN != '' }}
        uses: actions/checkout@v4
        with:
          repository: sdubois777/DungeonSimulator
          token: ${{ env.DUNGEONSIM_TOKEN }}
          path: DungeonSimulator

      - name: Set up Node for the port verifier
        if: ${{ env.DUNGEONSIM_TOKEN != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Executes the real TypeScript and compares all 7 outputs across 13,824
      # input combinations. Exits 0 and says it skipped if either the checkout
      # above or Node is missing.
      - name: Verify the power model port against its source
        run: python verify_scoring_port.py
        working-directory: sim

  balance-sweep:
    name: Full balance sweep
    # Manual only. About 25,000 simulated campaigns, roughly 18 minutes. Too
    # slow to gate a merge, but useful to run deliberately after a change to
    # the power model, the day loop, or the tuning constants.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run the sweep
        run: python -u experiments.py | tee balance-report.txt
        working-directory: sim

      - name: Upload the report
        uses: actions/upload-artifact@v4
        with:
          name: balance-report-${{ github.sha }}
          path: sim/balance-report.txt
          retention-days: 90
