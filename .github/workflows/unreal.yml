name: Unreal

# Compiles the game so a change that does not build cannot merge.
#
# WHY THIS EXISTS. Until 2026-09-07 nothing anywhere compiled the C++. The only
# job that ran was the Python suite in ci.yml, so roughly 1,471 Unreal automation
# tests existed and not one of them could block a merge. On that day a name
# collision merged into `development`: every check was green, and it was found
# when a person tried to build the game forty minutes later. It blocked three
# sessions until it was repaired. Issues #20 and #1462.
#
# A SEPARATE FILE FROM ci.yml ON PURPOSE. This needs its own `paths` filter and
# its own runner, and ci.yml gates every pull request in the repository. Keeping
# them apart means a mistake here cannot stop simulation and document work from
# merging.

on:
  pull_request:
    branches: [main, development]
    # Only what can affect the build. A documents-only or simulation-only change
    # does not need a compile, and the runner is one machine shared with whoever
    # is working on it.
    paths:
      - "game/**"
      - ".github/workflows/unreal.yml"
  push:
    branches: [main, development]
    paths:
      - "game/**"
      - ".github/workflows/unreal.yml"
  workflow_dispatch:

concurrency:
  group: unreal-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compile:
    name: Game compiles
    # ---------------------------------------------------------------------
    # SECURITY. THIS REPOSITORY IS PUBLIC AND THIS RUNNER IS THE PROJECT
    # OWNER'S OWN MACHINE.
    #
    # A self-hosted runner executes whatever a workflow tells it to. Without
    # this condition, anyone could fork the repository, open a pull request
    # whose workflow runs arbitrary commands, and have it run here. GitHub's
    # own documentation recommends against self-hosted runners on public
    # repositories for that reason.
    #
    # TWO INDEPENDENT LOCKS, DELIBERATELY. The repository is also set to
    # "Require approval for all external contributors" under Settings ->
    # Actions -> General, which stops a fork's workflow running without the
    # owner approving it. This condition is the second lock: the job refuses
    # to run at all unless the pull request comes from a branch in THIS
    # repository rather than a fork. Either alone would probably do. This one
    # is worth locking twice.
    # ---------------------------------------------------------------------
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64, unreal-windows]
    # A FULL BUILD, NOT AN INCREMENTAL ONE, THE FIRST TIME. The runner starts
    # from a fresh checkout with no build intermediates, so the first run
    # compiles everything. Later runs reuse the runner's work directory and are
    # much shorter. 90 minutes is generous on purpose: a job that fails on its
    # own timeout teaches nobody anything, and this one does not gate anything
    # that is waiting.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # tools/unreal_build.py is Python. The runner's service account may not
      # have an interpreter on its PATH, so one is installed rather than
      # assumed.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # WHY THE WRAPPER RATHER THAN Build.bat DIRECTLY. `Result: Succeeded` is
      # printed by builds that compiled nothing, and grepping for it alone hides
      # the reason a build failed. tools/unreal_build.py exits non-zero when the
      # build fails and reports which files were compiled. Until issue #436 it
      # had no entry point and every invocation exited 0 having done nothing,
      # which is why the exit code alone is not trusted here either.
      - name: Compile the editor target
        shell: pwsh
        run: python tools/unreal_build.py build

      # The step above fails the job on a compile error. This one exists so the
      # log ends with something a person can read at a glance rather than the
      # tail of a build log.
      - name: Say what was built
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem game/Binaries/Win64 -Filter "UnrealEditor-Cataclysm*.dll" -ErrorAction SilentlyContinue |
            Select-Object Name, Length, LastWriteTime | Format-Table -AutoSize
