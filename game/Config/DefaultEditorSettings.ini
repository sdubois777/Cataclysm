; Editor settings that are this project's defaults for every developer.
;
; ESC PAUSES THE GAME, SO SHIFT+ESC STOPS PLAY IN EDITOR. The project owner, 2026-11-24: "Offline and online, pause
; is a must". The game's pause is on Esc (`ACataclysmPlayerController::InputKey`), and the editor binds Esc to its own
; Stop command (`FPlayWorldCommands::StopPlaySession`, "PlayWorld" / "StopPlaySession", in the engine's
; DebuggerCommands.cpp). In Play In Editor the editor asks its play-world commands BEFORE the player controller
; (`UGameViewportClient::InputKey` runs `GameViewportInputKeyDelegate`, which is `UEditorEngine::ProcessDebuggerCommands`,
; first), so without this line Esc stops Play and the pause can never be reached there.
;
; HOW THE ENGINE READS THIS. `FUserDefinedChords::LoadChords` (Slate's InputBindingManager.cpp) reads the array
; `ProjectDefinedChords` in the section of the same name from the editor settings file, which takes this project
; file in its hierarchy, and applies each entry before a developer's own key bindings, which still win. Each entry is
; the JSON object the editor itself writes to EditorKeyBindings.ini, with `{`, `}` and `"` written as `~OpenBracket~`,
; `~CloseBracket~` and `~Quote~`. ALL NINE FIELDS ARE REQUIRED: `LoadChord` reads Control, Alt, Shift and Key without
; checking they are there, so an entry missing one stops the editor as it starts.
; `tools/tests/test_editor_stop_is_on_shift_escape.py` reads this entry back and checks every field.
;
; A developer who wants Esc to stop Play again can rebind Stop in Editor Preferences > Keyboard Shortcuts > Play World;
; their own binding replaces this one. `docs/DECISIONS.md`, 2026-11-24.
[ProjectDefinedChords]
+ProjectDefinedChords=~OpenBracket~~Quote~BindingContext~Quote~:~Quote~PlayWorld~Quote~,~Quote~CommandName~Quote~:~Quote~StopPlaySession~Quote~,~Quote~ChordIndex~Quote~:0,~Quote~Control~Quote~:false,~Quote~Alt~Quote~:false,~Quote~Shift~Quote~:true,~Quote~Command~Quote~:false,~Quote~Key~Quote~:~Quote~Escape~Quote~~CloseBracket~
