Description=An ARPG dungeon crawler with real-time empire management and roguelike meta-progression.

; Which control scheme the game starts in, and where the bindings live.
;
; THE TWO CONTEXTS ARE ALTERNATIVES, NOT LAYERS. Only one is added at a time.
; The design document lists W as the Support ability and also lists WASD as
; optional directional movement, and one key cannot be both. Diablo 4 and Path of
; Exile 2 both resolve this the same way, by shipping two presets rather than one
; scheme: under keyboard movement the skills shift off the movement keys.
;
;   IMC_MouseMovement    - the design document's table exactly. The left mouse
;                          button moves; Q, W, E, R, right mouse and space are
;                          abilities. Directional movement is on the gamepad
;                          stick only, so nothing collides.
;   IMC_KeyboardMovement - WASD moves. Support moves from W to 1; every other
;                          binding is unchanged. The left mouse button is free.
;
; Swapping schemes is this one line today. The in-game setting that should do it
; needs a settings screen, which is issue #49.
;
; Both assets are produced by tools/generate_input_assets.py.
[/Script/Cataclysm.CataclysmPlayerController]
InputConfig=/Game/Input/DA_InputConfig.DA_InputConfig
DefaultMappingContext=/Game/Input/IMC_MouseMovement.IMC_MouseMovement

; Which rung of the rarity ladder the sandbox spawns each creature at.
;
; Common 0, Elite 1, Legendary 2, Herald 3, Boss 4, Cataclysm Boss 5, from
; game/Data/EnemyRarities.csv. Anything outside 0 to 5 is clamped.
;
; RARITY DOES NOT CHANGE THE STAT BLOCK HERE. Health, armour and attack damage
; come from separate settings in CataclysmGameMode.h and are not touched by this.
; What rarity decides is what a kill gives and whether the creature can be
; stunned:
;
;   - game/Data/EnemyDrops.csv gives a Common 0.16 gear drops and a Boss exactly
;     5, so a Common kill gives nothing five times in six and a Boss gives five
;     items every time.
;   - A Boss adds 300% magic find to its own drops and a Cataclysm Boss adds
;     500%, so a rarer creature drops rarer gear as well as more of it.
;   - The design's rule that a boss cannot be stunned at all is
;     `RarityStep >= FirstBossRarityStep`, and 4 is the first boss rung.
;
; -1 MEANS DRAW ONE, and it is the default for the five creatures that fight.
; Since issue #508 each of those spawns with a rarity drawn from the weights in
; game/Data/EnemyRarities.csv: Common 0.60, Elite 0.20, Legendary 0.15, Herald
; 0.04, Boss 0.01, and never a Cataclysm Boss, which is placed rather than
; drawn. Before this, everything spawned Common unless a rung was typed in here
; by hand, so the rarity colours and the varying drop counts were hardly ever
; seen. Setting one to a rung from 0 to 5 still forces it, which is what to do
; when testing one rarity.
;
; THE TRAINING DUMMY DOES NOT DRAW ONE. It is a practice target and its stats
; come from the settings above rather than from its rarity, but a dummy that
; drew Boss could not be stunned at all, which would quietly break the thing a
; dummy is there to test.
;
; This is sandbox scaffolding. What decides how many creatures of each rarity a
; floor holds, rather than what one creature draws, belongs with the dungeon
; runtime, issue #41. Issue #721.
[/Script/Cataclysm.CataclysmGameMode]
BruteRarityStep=-1
AbyssalWardenRarityStep=-1
HellhoundRarityStep=-1
ImpRarityStep=-1
CorruptedSentinelRarityStep=-1
SuccubusRarityStep=-1
TrainingDummyRarityStep=0
