[/Script/GameplayTags.GameplayTagsSettings]
; Load every .ini in Config/Tags. CataclysmTags.ini there is generated from the
; Tags sheet of docs/All_Things_Cataclysm.xlsx by tools/generate_gameplay_tags.py.
ImportTagsFromConfig=True

; Warn rather than fail when a tag is used before it is declared. The design data
; is still being written, and a hard error would block the editor on an
; unfinished spreadsheet row.
