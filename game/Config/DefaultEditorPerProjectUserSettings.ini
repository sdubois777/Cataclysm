; Editor settings that are per-project defaults rather than per-developer.
;
; UModelContextProtocolSettings is declared config=EditorPerProjectUserSettings,
; so its section belongs in this file rather than DefaultEngine.ini. Values here
; are the project's defaults; a developer's own overrides land in
; game/Saved/Config/WindowsEditor/EditorPerProjectUserSettings.ini and are not
; committed.

; The Model Context Protocol server that Epic ships inside Unreal Engine 5.8.
; It lets an AI coding agent drive the editor -- spawn actors, inspect widgets,
; run automation tests -- over a local HTTP connection.
;
; bAutoStartServer defaults to False, which means the server exists but never
; listens and every connection attempt fails with nothing explaining why. True is
; what actually makes it work.
;
; The server binds to 127.0.0.1 only and has no authentication, which is why the
; port is left at the default rather than exposed. Enabling the plugin requires
; both ModelContextProtocol and AllToolsets in Cataclysm.uproject; the toolsets
; are what supply the tools, and with only the server enabled it answers with an
; almost empty tool list.
;
; The plugin is marked experimental by Epic. It is editor-only and reaches no
; packaged build.
[/Script/ModelContextProtocolEngine.ModelContextProtocolSettings]
bAutoStartServer=True
ServerPortNumber=8000
ServerUrlPath=/mcp
