GameplayTagList=(Tag="Keyword.NoCrit",DevComment="A hit that cannot critically strike, whatever the attacker rolls. Carried by a summoned minion, whose blow is dealt in its summoner name.")
GameplayTagList=(Tag="Keyword.NoLeech",DevComment="A hit that leeches nothing back to the attacker, whatever the attacker's life, mana or energy shield leech is. Carried by a summoned minion, whose blow is dealt in its summoner's name and which the design says takes none of its summoner's leech.")
GameplayTagList=(Tag="Keyword.NoPenetration",DevComment="A hit that ignores none of the target's armour or resistance, whatever the attacker's penetration is. Carried by a summoned minion, whose blow is dealt in its summoner's name.")
GameplayTagList=(Tag="Keyword.NoRetaliation",DevComment="A hit that provokes no retaliation from what it strikes, whatever retaliation the target has. Carried by a summoned minion, whose blow is dealt in its summoner name, so without it a defender would deal its retaliation to a summoner standing well away from the fight.")
GameplayTagList=(Tag="Keyword.NoWeaponSubType",DevComment="A hit that carries none of the attacker's weapon sub-type effects, whatever weapon the attacker holds. Carried by a summoned minion, whose blow is dealt in its summoner's name.")
GameplayTagList=(Tag="Keyword.Regeneration",DevComment="A pool refilled by the character's own regeneration rate, rather than by leech or by anything a skill does. Carried so a passive node can be scoped to regeneration alone.")
