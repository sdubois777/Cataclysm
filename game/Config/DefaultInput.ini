[/Script/Engine.InputSettings]
DefaultPlayerInputClass=/Script/EnhancedInput.EnhancedPlayerInput

; UCataclysmInputComponent, not the plain EnhancedInputComponent. It adds the two
; functions that bind a whole input config at once. If this is left at the engine
; default the player controller finds the wrong class, logs an error and binds
; nothing, and no key in the game does anything.
DefaultInputComponentClass=/Script/Cataclysm.CataclysmInputComponent
