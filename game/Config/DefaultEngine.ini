[/Script/EngineSettings.GameMapsSettings]
GameDefaultMap=/Game/Maps/L_Sandbox.L_Sandbox
EditorStartupMap=/Game/Maps/L_Sandbox.L_Sandbox

; Set globally rather than on the level, so opening any level directly still gets
; the real player pawn, controller and player state. The player state is where the
; ability system component lives, so a level that fell back to the engine default
; game mode would spawn a character with no attributes and no abilities.
GlobalDefaultGameMode=/Script/Cataclysm.CataclysmGameMode

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12

[/Script/Engine.RendererSettings]
r.DefaultFeature.AutoExposure=False
r.Lumen.HardwareRayTracing=False
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.GenerateMeshDistanceFields=True

[/Script/PythonScriptPlugin.PythonScriptPluginSettings]
bRemoteExecution=True

[/Script/NavigationSystem.RecastNavMesh]
; A dungeon floor does not exist until the game runs, so a navigation
; mesh baked into a saved map cannot cover one. Dynamic rebuilds the mesh
; at run time from whatever collision geometry is actually there.
;
; THE ENGINE DEFAULT IS Static AND THAT IS NOT A SETTING ANYONE CHOSE.
; ANavigationData's constructor leaves this as LegacyGeneration and
; PostInitProperties resolves it to Static, so a project that never
; mentions navigation gets a mesh that is only ever built in the editor.
; Checked by reading Engine/Source/Runtime/NavigationSystem/Private/
; NavigationData.cpp, not by reading a forum.
RuntimeGeneration=Dynamic

[SystemSettings]
; THE FRAME-TIME BUDGET FOR PARTICLE EFFECTS. Issue #547. Section 4 of
; docs/Niagara_Conventions.md has the measurement these came from and the
; procedure for repeating it.
;
; UNREAL SHIPS THIS BUDGET AND SHIPS IT SWITCHED OFF. fx.Budget.Enabled and
; fx.Budget.EnabledInEditor are both false by default, so the three figures
; below sit in the engine doing nothing until a project sets them here. Nothing
; tracks what effects cost, the Budget column of the Niagara debug display reads
; zero, and the "cull by global budget" switch on an effect type has no input to
; act on. That was this project's state until 2026-08-22.
;
; THE THREE FIGURES ARE THE ENGINE'S OWN DEFAULTS, KEPT DELIBERATELY. Epic
; publishes no numeric target -- its own page on measuring Niagara performance
; says to capture your own game rather than apply a universal figure -- so 2 ms
; is the only published reference there is. It is also generous here: a frame at
; 60 frames per second is 16.7 ms, so this allows effects an eighth of it.
;
; MEASURED 2026-08-22, on a dungeon floor at the designed creature density with
; the player in a fight against twelve to seventeen creatures:
;
;   game thread only          0.12 ms average, 0.95 ms worst frame
;   game thread + concurrent  0.91 ms average, 2.37 ms worst frame
;   render thread             0.47 ms average, 1.05 ms worst frame
;
; SO THE WORST FRAME IS ALREADY OVER ONE OF THE THREE, and that is recorded
; rather than accommodated. Raising the budget to fit the measurement would
; defeat the point of having one. Issue #822 is the work that brings it down:
; one system, NS_Impact_Point, is 80 per cent of all particle cost.
;
; TURNING THE BUDGET ON DOES NOT CULL ANYTHING BY ITSELF. Culling by it also
; needs bCullByGlobalBudget on each effect type, which is false on all four and
; is now written false deliberately by tools/generate_effect_types.py rather
; than left untouched. Issue #824 is the decision to turn it on, and it is
; blocked on #822 for a reason stated there.
fx.Budget.Enabled=1
fx.Budget.EnabledInEditor=1
fx.Budget.GameThread=2.0
fx.Budget.GameThreadConcurrent=2.0
fx.Budget.RenderThread=2.0
