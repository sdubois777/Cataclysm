[/Script/EngineSettings.GameMapsSettings]
GameDefaultMap=/Game/Maps/L_Sandbox.L_Sandbox
EditorStartupMap=/Game/Maps/L_Sandbox.L_Sandbox

; Set globally rather than on the level, so opening any level directly still gets
; the real player pawn, controller and player state. The player state is where the
; ability system component lives, so a level that fell back to the engine default
; game mode would spawn a character with no attributes and no abilities.
GlobalDefaultGameMode=/Script/Cataclysm.CataclysmGameMode

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12

[/Script/Engine.RendererSettings]
r.DefaultFeature.AutoExposure=False
r.Lumen.HardwareRayTracing=False
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.GenerateMeshDistanceFields=True

[/Script/PythonScriptPlugin.PythonScriptPluginSettings]
bRemoteExecution=True

[/Script/NavigationSystem.RecastNavMesh]
; A dungeon floor does not exist until the game runs, so a navigation
; mesh baked into a saved map cannot cover one. Dynamic rebuilds the mesh
; at run time from whatever collision geometry is actually there.
;
; THE ENGINE DEFAULT IS Static AND THAT IS NOT A SETTING ANYONE CHOSE.
; ANavigationData's constructor leaves this as LegacyGeneration and
; PostInitProperties resolves it to Static, so a project that never
; mentions navigation gets a mesh that is only ever built in the editor.
; Checked by reading Engine/Source/Runtime/NavigationSystem/Private/
; NavigationData.cpp, not by reading a forum.
RuntimeGeneration=Dynamic
